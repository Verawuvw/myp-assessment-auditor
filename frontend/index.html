<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MYP Assessment Auditor</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <header class="hero">
      <h1>MYP Assessment Auditor</h1>
      <p class="subtitle">上传 MYP 评估任务 PDF，获取概念性理解审计报告。</p>
    </header>

    <section class="card">
      <form id="audit-form" class="form">
        <label class="field">
          <span class="field-label">评估任务 PDF</span>
          <input id="file-input" type="file" name="file" accept="application/pdf,.pdf" required />
        </label>

        <label class="field">
          <span class="field-label">报告语言</span>
          <select id="lang-select" name="lang">
            <option value="auto" selected>自动（跟随任务语言）</option>
            <option value="zh">中文</option>
            <option value="en">English</option>
          </select>
        </label>

        <button id="submit-btn" type="submit">开始审计</button>
      </form>

      <p id="status" class="status" role="status" aria-live="polite"></p>
    </section>

    <section id="result-card" class="card result-card hidden">
      <div class="result-header">
        <h2>审计报告</h2>
        <button id="copy-btn" type="button" class="ghost-btn">复制</button>
      </div>
      <div id="report" class="report"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
